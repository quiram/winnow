name: winnow
version: 0.7.0
description: >-
  Skills for managing a software product's requirements and roadmap: distil
  brainstorming conversations, meeting transcripts and audio recordings into
  durable AI context updates and well-formed task-tracker tickets, with local
  audio transcription and live-meeting contradiction and gap flagging.
author: Abraham Marin Perez
license: MIT
dependencies:
  apm: []
  mcp: []
includes: auto
devDependencies:
  apm: []
scripts: {}
marketplace:
  owner:
    name: Abraham Marin Perez
    url: https://github.com/quiram

  # Default tag pattern used to resolve version ranges for each package.
  build:
    tagPattern: "v{version}"

  # Output targets. 'claude' generates .claude-plugin/marketplace.json,
  # consumed by both APM and Claude Code's native /plugin marketplace flow.
  outputs:
    claude: {}

  # This repo is both the package and the marketplace that serves it:
  # the single entry below points at the repo root itself.
  packages:
    - name: winnow
      description: >-
        Requirements and roadmap management skills: process-requirements
        (distil input into a reviewable proposal), update-context (fold
        approved knowledge into the project's AI context), create-tasks
        (turn approved work items into tracker tickets), transcribe-audio
        (local Whisper transcription of files and live streams),
        listen-to-meeting (flag contradictions and gaps live during a meeting) and
        setup-audio (guided one-time preparation of the audio stack).
      source: ./
      version: 0.7.0
